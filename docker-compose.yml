services:
  sidebro:
    build:
      context: .
      dockerfile: Dockerfile
    image: sidebro-ai:latest
    container_name: sidebro
    restart: unless-stopped
    # Host port is configurable (SIDEBRO_PORT) in case 3001 is taken by another project
    ports:
      - "${SIDEBRO_PORT:-3001}:3001"
    # API keys and model settings come from the repo-root .env (see .env.example)
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATA_DIR=/app/server/data
      # The container cannot see the host's Wi-Fi IP; pass it so the phone pairing QR code works
      - HOST_IP=${HOST_IP:-}
    volumes:
      - sidebro-data:/app/server/data

volumes:
  sidebro-data:
    driver: local
